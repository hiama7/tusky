name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-backend:
    name: Site backend (MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
          MARIADB_DATABASE: predictx_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/predictx_test
      DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/predictx_test
    defaults:
      run:
        working-directory: backend/PREDICTX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/PREDICTX/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  site-frontend:
    name: Site frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/PREDICTX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/PREDICTX/package-lock.json
      - run: npm ci
      - run: npm run build

  data-and-ml:
    name: Ingestion and ML (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tusky
          POSTGRES_PASSWORD: tusky
          POSTGRES_DB: tusky
        ports: ['5433:5432']
        options: >-
          --health-cmd="pg_isready -U tusky" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      # creates and migrates tusky_test, which the Python tests then use
      - run: npm test
      - run: npm run ml:setup
      - run: npm run ml:test
