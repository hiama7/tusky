services:
  postgres:
    image: postgres:17-alpine
    container_name: tusky-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tusky
      POSTGRES_PASSWORD: tusky
      POSTGRES_DB: tusky
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - tusky-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tusky -d tusky"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PREDICTX backend database (MySQL 8). Separate from the tusky Postgres above.
  predictx-mysql:
    image: mysql:8.4
    container_name: predictx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${PREDICTX_MYSQL_ROOT_PASSWORD:-predictx_root}
      MYSQL_DATABASE: predictx
      MYSQL_USER: predictx
      MYSQL_PASSWORD: ${PREDICTX_MYSQL_PASSWORD:-predictx}
    ports:
      - "${PREDICTX_MYSQL_PORT:-3307}:3306"
    volumes:
      - predictx-mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tusky-pgdata:
  predictx-mysqldata:
